<!doctype html>
<html>
  <head><title>TabTune E2E media page</title></head>
  <body>
    <!--
      NOTE (Task 16 risk mitigation): the brief's original data-URI video
      (data:video/mp4;base64,AAAA) is invalid media data and never actually
      produces sound, so the tab never becomes `audible: true` and the
      extension's popup list stays empty. This page instead plays a real,
      valid, committed WAV file (e2e/tone.wav — generated by
      e2e/generate-tone.mjs) so the tab genuinely emits audio.
    -->
    <audio id="a" src="./tone.wav" autoplay loop></audio>
    <script>document.getElementById('a').muted = false;</script>
  </body>
</html>
