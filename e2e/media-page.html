<!doctype html>
<html>
  <head><title>TabFader E2E media page</title></head>
  <body>
    <!--
      Plays a real, committed WAV (e2e/tone.wav, generated by e2e/generate-tone.mjs) so the
      tab genuinely becomes `audible: true`; a fake data-URI never produces sound.
      Query params: ?title=<text> sets the tab title so popup rows are distinguishable;
      ?vol=<0..1> sets the page's own volume, like a site restoring its player volume.
    -->
    <audio id="a" src="./tone.wav" autoplay loop></audio>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.has('title')) document.title = params.get('title');
      document.getElementById('a').muted = false;
      if (params.has('vol')) document.getElementById('a').volume = Number(params.get('vol'));
    </script>
  </body>
</html>
